<style>
/* Rediseño visual inspirado en composiciones de degradados y curvas superpuestas. */
:root{
 --navy:#111c64;
 --blue:#273bb4;
 --ink:#172044;
 --muted:#6d7391;
 --line:#e7e5ef;
 --bg:#f7f3f7;
 --green:#087d63;
 --radius:20px;
 --pink:#e91e72;
 --coral:#ff665d;
 --gold:#ffbd66;
}
body{
 background:
  radial-gradient(circle at 3% 8%,#ffd8c966 0,transparent 25%),
  radial-gradient(circle at 95% 24%,#dcd8ff70 0,transparent 28%),
  linear-gradient(180deg,#faf5f6 0%,#f6f5fb 46%,#f8f6f4 100%);
}
.topbar{
 min-height:194px;
 isolation:isolate;
 background:linear-gradient(122deg,#101c66 0%,#1e319d 49%,#7e247e 100%);
 box-shadow:0 18px 46px #251b6330;
}
.topbar::before{
 content:"";
 position:absolute;
 inset:0;
 height:auto;
 background:
  radial-gradient(circle at 88% 10%,#ffbf6647 0,transparent 25%),
  linear-gradient(90deg,transparent 0 55%,#1827771f 100%);
 pointer-events:none;
}
.topbar::after{
 content:none;
}
.header-art{
 position:absolute;
 z-index:-1;
 width:530px;
 height:530px;
 right:-122px;
 top:-260px;
 border-radius:50%;
 background:linear-gradient(140deg,#ffbd66 6%,#ff665d 35%,#e91e72 62%,#342da7 91%);
 box-shadow:
  -42px 17px 0 #d91b7eb8,
  -84px 34px 0 #8d268f99,
  -126px 51px 0 #29389d7d;
}
.header-art::before{
 content:"";
 position:absolute;
 inset:62px;
 border-radius:50%;
 background:linear-gradient(145deg,#ffcc72,#ff5f67 42%,#ed1475 68%,#2838a7);
 box-shadow:inset -22px -24px 55px #32239954;
}
.header-art::after{
 content:"";
 position:absolute;
 inset:142px;
 border-radius:50%;
 background:linear-gradient(145deg,#ffd078,#ff735e 45%,#ee1b72 72%,#4d2ca5);
 box-shadow:0 18px 45px #27145945;
}
.topbar-inner{
 width:min(1160px,100%);
 min-height:194px;
 padding:31px 17px 47px;
 justify-content:flex-start;
}
.topbar h1{
 position:relative;
 display:flex;
 flex-direction:column;
 margin:0;
 color:#fff;
 text-shadow:0 5px 26px #08104542;
}
.topbar h1 strong{
 font-size:clamp(13px,1.6vw,16px);
 font-weight:750;
 letter-spacing:.32em;
 line-height:1;
}
.topbar h1 span{
 margin-top:9px;
 font-size:clamp(29px,4.5vw,46px);
 font-weight:790;
 letter-spacing:-.035em;
 line-height:1.04;
}
.topbar h1::after{
 content:"";
 width:70px;
 height:4px;
 margin-top:17px;
 border-radius:999px;
 background:linear-gradient(90deg,var(--gold),var(--coral),var(--pink));
 box-shadow:0 4px 14px #ff617d6b;
}
main{
 position:relative;
 z-index:2;
 margin:-32px auto 52px;
}
.search-panel{
 border:1px solid #ffffffb8;
 border-radius:22px;
 background:#fffffff2;
 box-shadow:0 20px 55px #2b245027,0 2px 8px #25214b0c;
 padding:20px;
 backdrop-filter:blur(16px);
}
.search-field{
 border:1px solid #d9d8e8;
 border-radius:15px;
 background:#faf9fc;
 box-shadow:inset 0 1px 2px #161d4d09;
 transition:border-color .2s,box-shadow .2s,background .2s;
}
.search-field:focus-within{
 border-color:#7d4cc8;
 background:#fff;
 box-shadow:0 0 0 4px #744ec21b;
}
.search-field svg{color:#6d3db4}
.filters{gap:8px;margin-top:15px}
.filters button{
 border-color:#e2dfea;
 background:#f5f3f8;
 color:#434768;
 padding:8px 14px;
 transition:transform .18s,box-shadow .18s,border-color .18s;
}
.filters button:hover{transform:translateY(-1px);border-color:#bdb5dc}
.filters button.active{
 border-color:#293ead;
 background:#293ead;
 color:#fff;
 box-shadow:0 7px 18px #293ead2e;
}
.toolbar{margin:20px 2px 15px}
.toolbar .count{color:#242852;font-size:15px}
.toolbar select{border-color:#dfddea;border-radius:10px;color:#3d4266;box-shadow:0 4px 14px #3431530a}
.results{gap:16px}
.product{
 border:1px solid #ffffff;
 border-radius:18px;
 background:#ffffffed;
 box-shadow:0 12px 35px #31295314,0 2px 7px #3129530d;
 transition:transform .2s,box-shadow .2s;
}
.product:hover{transform:translateY(-3px);box-shadow:0 18px 42px #31295320,0 3px 8px #31295310}
.thumb{border-color:#ece9f2;border-radius:14px;background:linear-gradient(145deg,#f9f7fb,#f0f1fa)}
.code{
 align-self:flex-start;
 border-radius:7px;
 background:#eceefe;

 padding:2px 7px;
 font-size:15px;
}
.product h2{color:#20264b}
.details-btn{
 margin-left:auto;
 border:0;
 border-radius:10px;
 background:#293ead;
 color:#fff;
 padding:9px 12px;
 box-shadow:0 7px 16px #293ead2b;
 transition:transform .18s,box-shadow .18s;
}
.details-btn:hover{transform:translateY(-1px);background:#20328f;box-shadow:0 10px 22px #293ead3d}
.pager button,.source-button{
 border-color:#dad7e9;
 color:#343f9e;
 box-shadow:0 4px 14px #302d570c;
}
.source-button.active{
 border-color:#293ead;
 background:#293ead;
 color:#fff;
}
.page-preview-wrap{position:relative;width:min(100%,440px);margin:13px auto;line-height:0}
.page-preview-wrap .page-preview{width:100%;margin:0}
.page-markers{position:absolute;inset:0;pointer-events:none}
.page-marker{position:absolute;border:3px solid #ef3d74;border-radius:6px;background:#ef3d7426;box-shadow:0 0 0 3px #fff9,0 5px 16px #4a174b42;min-width:13px;min-height:12px}
.page-marker.approximate{border-style:dashed;border-color:#e58623;background:#f3a13b24}
.page-marker span{position:absolute;left:-3px;bottom:calc(100% + 4px);background:#293ead;color:#fff;border-radius:5px;padding:4px 6px;font:700 10px/1.2 ui-sans-serif,system-ui;white-space:nowrap;box-shadow:0 4px 11px #15184538}
.overlay{background:#101847c9;backdrop-filter:blur(6px)}
.modal{
 border:1px solid #e3e1eb;
 border-radius:22px;
 box-shadow:0 30px 90px #090e3d70;
}
.modal:focus{outline:none}
.modal::before{
 content:none;
}
.close{background:#f0eef6;color:#34385d}
.meta{border-color:#ebe8f1;border-radius:13px;background:#faf9fc}
.picture{border-color:#e5e2ed;border-radius:15px;background:linear-gradient(145deg,#faf9fc,#f1f2f9)}
.tabs{border-color:#e5e2ee}
.switch.active{color:#6e2ca0;border-color:#b62b8b}
.empty{border-color:#d8d2e7;background:#ffffffd9}
.foot{border-color:#ded9e7;color:#75738b}
@media(max-width:1100px){
 .header-art{
  width:470px;
  height:470px;
  right:-280px;
  top:-230px;
  box-shadow:-32px 13px 0 #d91b7e9e,-64px 26px 0 #8d268f73,-96px 39px 0 #29389d52;
 }
 .header-art::before{inset:58px}
 .header-art::after{inset:130px}
 .topbar h1{max-width:calc(100% - 190px)}
}
@media(max-width:650px){
 html,body{overflow-x:hidden}
 .topbar,.topbar-inner{min-height:164px}
 .topbar-inner{padding:24px 17px 38px}
 .header-art{width:340px;height:340px;right:-250px;top:-165px;box-shadow:none}
 .header-art::before{inset:42px}
 .header-art::after{inset:96px}
 .topbar h1{max-width:calc(100% - 90px)}
 main{margin-top:-25px}
 .search-panel{padding:13px;border-radius:18px}
 .search-field{overflow:hidden}
 .search-field input{width:100%}
 .toolbar{align-items:stretch}
 .toolbar .count,.toolbar label{width:100%}
 .toolbar label{justify-content:space-between}
 .toolbar select{max-width:70%}
 .results,.product{min-width:0;max-width:100%}
 .product{overflow:hidden}
 .row-bottom{flex-wrap:wrap}
 .details-btn{margin-left:auto}
 .product:hover{transform:none}
}
</style>
</head>
<body>
<header class="topbar"><div class="header-art" aria-hidden="true"></div><div class="topbar-inner"><h1><strong>MEPROLIM</strong><span>Buscador de artículos</span></h1></div></header>
<main>
<section class="search-panel" aria-label="Buscar artículos">
 <label class="search-field"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="query" type="search" placeholder="Código, nombre, descripción..." autocomplete="off" aria-label="Buscar artículo por código o nombre"/><button id="clear" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" hidden>×</button></label>
 <div class="filters" id="filters" role="group" aria-label="Filtrar por catálogo"></div>
</section>
<div class="toolbar"><div class="count" id="count" aria-live="polite">Cargando artículos…</div><label>Ordenar <select id="sort"><option value="relevancia">Relevancia</option><option value="codigo">Código A → Z</option><option value="nombre">Nombre A → Z</option></select></label></div>
<div class="results" id="results" aria-live="polite"><div class="load">Preparando índice…</div></div><div id="pager" class="pager"></div>
<div class="foot">Buscador unificado de referencias MEPROLIM. Cada ficha conserva el acceso a la página de origen y a la posición localizada del código.</div>
</main>
<div class="overlay" id="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1" id="dialog"><div id="modalBody"></div></section></div>
<script>
'use strict';
let products=[],filtered=[],catalog='todos',page=0,lastFocus=null;const PAGE_SIZE=36;
const $=x=>document.getElementById(x);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function codeNorm(v){return norm(v).replace(/[^a-z0-9]/g,'');}
function isGood(p){return ['revisado_fuente_oficial','revisado_catalogo','verificado_muestra'].includes(p.estado);}
function path(s){const value=String(s||'');return /^https?:\/\//i.test(value)?value:'./'+value.replace(/^\.?\//,'');}
const cats=[['todos','Todos'],['verde','Verde · Químicos'],['gris','Gris · Útiles'],['rojo','Rojo · Maquinaria'],['marron','Marrón · Complementos']];
function drawFilters(){$('filters').innerHTML=cats.map(([id,name])=>`<button class="${catalog===id?'active':''}" type="button" data-cat="${id}" aria-pressed="${catalog===id}">${esc(name)}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{catalog=b.dataset.cat;page=0;drawFilters();refresh();}));}
function score(p,terms,qc){let s=0,code=codeNorm(p.codigo),name=norm(p.nombre_propuesto),text=norm(p.texto_busqueda);if(qc){if(code===qc)s+=2000;else if(code.startsWith(qc))s+=800;else if(code.includes(qc))s+=450;}for(const term of terms){if(name.includes(term))s+=80;if(text.includes(term))s+=10;}if(isGood(p))s+=12;return s;}
function refresh(){const q=norm($('query').value.trim());const terms=q.split(/\s+/).filter(Boolean);const qc=codeNorm(q);filtered=products.filter(p=>(catalog==='todos'||p.catalogos.includes(catalog))&&(!q||(qc&&codeNorm(p.codigo).includes(qc))||terms.every(w=>norm(p.texto_busqueda).includes(w))));let sort=$('sort').value;if(sort==='codigo')filtered.sort((a,b)=>a.codigo.localeCompare(b.codigo));else if(sort==='nombre')filtered.sort((a,b)=>a.nombre_propuesto.localeCompare(b.nombre_propuesto,'es'));else filtered.sort((a,b)=>score(b,terms,qc)-score(a,terms,qc)||a.codigo.localeCompare(b.codigo));page=0;render();}
function render(){
 let total=filtered.length;let count=Math.max(1,Math.ceil(total/PAGE_SIZE));page=Math.min(Math.max(0,page),count-1);
 $('count').innerHTML=`${total.toLocaleString('es-ES')} referencias <small>· ${products.length.toLocaleString('es-ES')} en el índice</small>`;
 $('results').innerHTML=total?filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).map(p=>{
  const image=p.imagen_principal?`<img loading="lazy" src="${esc(path(p.imagen_principal))}" alt="Fotografía del artículo ${esc(p.codigo)}" onerror="this.parentElement.innerHTML='📦'"/>`:`<span class="placeholder" aria-hidden="true">▣</span>`;
  return `<article class="product"><div class="thumb">${image}</div><div class="product-body"><span class="code">${esc(p.codigo)}</span><h2>${esc(p.nombre_propuesto)}</h2><div class="catalogs">${p.catalogos.map(c=>c[0].toUpperCase()+c.slice(1)).join(' · ')}</div><div class="row-bottom"><button class="details-btn" data-code="${esc(p.codigo)}" type="button">Ver ficha</button></div></div></article>`;
 }).join(''):'<div class="empty"><strong>No se encontraron coincidencias.</strong><p>Prueba un código parcial o palabras distintas.</p></div>';
 $('results').querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.code)));
 $('pager').innerHTML=total>PAGE_SIZE?`<button id="prev" ${page===0?'disabled':''}>← Anterior</button><span>${page+1} / ${count}</span><button id="next" ${page===count-1?'disabled':''}>Siguiente →</button>`:'';
 if($('prev'))$('prev').onclick=()=>{page--;render();window.scrollTo({top:130,behavior:'smooth'});};if($('next'))$('next').onclick=()=>{page++;render();window.scrollTo({top:130,behavior:'smooth'});};
}
function openDetail(code){const p=products.find(x=>x.codigo===code);if(!p)return;lastFocus=document.activeElement;const img=p.imagen_principal;const src=p.fuentes||[];let pics=(p.imagenes||[]);let status=isGood(p)?'':'<div class="info">Referencia pendiente de validación completa. La marca en la página permite comprobar dónde aparece el código.</div>';
$('modalBody').innerHTML=`<div class="modal-head"><div><div class="code">${esc(p.codigo)}</div><h2 id="detailTitle">${esc(p.nombre_propuesto)}</h2><div class="small">${p.catalogos.map(c=>c[0].toUpperCase()+c.slice(1)).join(' · ')}</div></div><button class="close" id="close" aria-label="Cerrar ficha">×</button></div><div class="detail-grid"><div><div class="picture" id="picture">${img?`<img src="${esc(path(img))}" alt="Fotografía del artículo ${esc(p.codigo)}"/>`:'<div class="small">No hay fotografía individual asociada.<br>Consulta la ubicación marcada en el catálogo.</div>'}</div><div class="gallery" id="gallery"></div></div><div><div class="meta"><b>CÓDIGO</b><p>${esc(p.codigo)} <button type="button" class="source-button" id="copyCode">Copiar código</button></p></div><div class="meta"><b>DESCRIPCIÓN</b><p>${esc(p.descripcion||'Consulta la página de origen para ver las especificaciones y la presentación del artículo.')}</p></div>${p.presentacion_propuesta?`<div class="meta"><b>PRESENTACIÓN</b><p>${esc(p.presentacion_propuesta)}</p></div>`:''}${p.nota_conflicto?`<div class="info"><strong>Conflicto:</strong> ${esc(p.nota_conflicto)}</div>`:''}${status}<div class="tabs"><button class="switch active" id="sourceTab">Páginas de origen (${src.length})</button></div><div class="source-row" id="sources"></div><p class="small" id="pageLabel"></p><div class="page-preview-wrap"><img class="page-preview" id="pageImage" alt="Página original del catálogo" loading="lazy"/><div class="page-markers" id="pageMarkers" aria-hidden="true"></div></div></div></div>`;
$('close').onclick=closeDetail;$('copyCode').onclick=()=>{navigator.clipboard?.writeText(p.codigo).then(()=>{$('copyCode').textContent='Copiado ✓';}).catch(()=>fallbackCopy(p.codigo));};$('gallery').innerHTML=pics.map((im,i)=>`<button type="button" data-pic="${i}" aria-label="Ver imagen ${i+1}" class="${i===0?'active':''}"><img src="${esc(path(im.ruta))}" alt="Miniatura del artículo"/></button>`).join('');$('gallery').querySelectorAll('button').forEach(b=>b.onclick=()=>{const pic=pics[Number(b.dataset.pic)];$('picture').innerHTML=`<img src="${esc(path(pic.ruta))}" alt="Fotografía del artículo ${esc(p.codigo)}"/>`;$('gallery').querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===b));});
$('sources').innerHTML=src.map((s,i)=>`<button type="button" class="source-button ${i===0?'active':''}" data-index="${i}">${esc(s.catalogo)} · pág. ${s.pagina}</button>`).join('');$('sources').querySelectorAll('button').forEach(b=>b.onclick=()=>chooseSource(src[Number(b.dataset.index)],b));if(src[0])chooseSource(src[0],$('sources').querySelector('button'));$('overlay').classList.add('show');document.body.style.overflow='hidden';$('dialog').focus();}
function chooseSource(source,btn){
 $('pageImage').src=path(`paginas/${source.catalogo}/${source.pagina}.webp`);
 const markers=source.marcadores||[];
 $('pageMarkers').innerHTML=markers.map((marker,index)=>`<div class="page-marker ${marker.aproximado?'approximate':''}" style="left:${Number(marker.x)}%;top:${Number(marker.y)}%;width:${Number(marker.w)}%;height:${Number(marker.h)}%"><span>${index===0?(marker.aproximado?'Ubicación aproximada':'Código localizado'):''}</span></div>`).join('');
 $('pageLabel').textContent=`Página ${source.pagina} del catálogo ${source.catalogo}. ${markers.length?'El recuadro señala la posición del código.':'No se pudo localizar el código con precisión en esta página.'}`;
 $('sources').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));
}
function fallbackCopy(code){const e=document.createElement('textarea');e.value=code;document.body.append(e);e.select();document.execCommand('copy');e.remove();}
function closeDetail(){$('overlay').classList.remove('show');document.body.style.overflow='';lastFocus?.focus();}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDetail();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeDetail();});
$('query').addEventListener('input',()=>{$('clear').hidden=!$('query').value;refresh();});$('clear').onclick=()=>{$('query').value='';$('clear').hidden=true;refresh();$('query').focus();};$('sort').onchange=refresh;drawFilters();
fetch('./data/articulos.json').then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(rows=>{products=rows;refresh();}).catch(err=>{$('count').textContent='Error al cargar los datos';$('results').innerHTML=`<div class="empty">No se pudo cargar la base de datos. Utiliza un servidor local en lugar de abrir el archivo HTML directamente. ${esc(err.message)}</div>`;});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
